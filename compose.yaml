services:
  image-tools:
    build:
      context: .
    image: pytools-image-tools:latest
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-5001}:5001"
    environment:
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-50}"
      MAX_FILES_PER_JOB: "${MAX_FILES_PER_JOB:-10}"
      MAX_IMAGE_PIXELS: "${MAX_IMAGE_PIXELS:-40000000}"
      MAX_TOTAL_PIXELS: "${MAX_TOTAL_PIXELS:-100000000}"
      PROCESSING_CONCURRENCY: "${PROCESSING_CONCURRENCY:-2}"
      RATE_LIMIT_REQUESTS: "${RATE_LIMIT_REQUESTS:-20}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      FILE_RETENTION_HOURS: "${FILE_RETENTION_HOURS:-1}"
      ARTIFACT_CLEANUP_INTERVAL_SECONDS: "${ARTIFACT_CLEANUP_INTERVAL_SECONDS:-600}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-true}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-2}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-180}"
    volumes:
      - image-tools-uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  image-tools-uploads:
